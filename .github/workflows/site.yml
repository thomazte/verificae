name: Atualizar e publicar o site

on:
  schedule:
    - cron: "0 9,21 * * *"   # duas vezes por dia (UTC): 06h e 18h em Brasília
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/site.yml"]
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar checagens novas (Lupa, Aos Fatos, G1 Fato ou Fake)
        run: python3 scripts/fetch_checagens.py

      # Guarda o acumulado no repositório (os feeds só trazem os últimos itens).
      # Um push feito com o GITHUB_TOKEN não dispara outro workflow, então não há loop.
      - name: Salvar checagens no repositório
        run: |
          git config user.name "robo-checagens"
          git config user.email "actions@users.noreply.github.com"
          git add site/index.html site/checagens.json site/checagens_semente.json
          git diff --staged --quiet || (git commit -m "Atualiza checagens" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
