name: Aprovar cartão do dossiê

# Quando o dono do repositório põe a etiqueta "aprovado" numa issue do formulário de cartão,
# o conteúdo é validado, gravado no dossiê e publicado. A issue é tratada só como dado.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: dossie
  cancel-in-progress: false

jobs:
  aplicar:
    if: >-
      github.event.label.name == 'aprovado' &&
      contains(github.event.issue.labels.*.name, 'cartao') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMERO: ${{ github.event.issue.number }}
      RESULTADO: ${{ github.workspace }}/resultado.md
    steps:
      - uses: actions/checkout@v4

      - name: Validar e aplicar
        id: aplicar
        continue-on-error: true
        run: python3 scripts/aplicar_issue.py

      - name: Publicar (aplicado com sucesso)
        if: steps.aplicar.outcome == 'success'
        run: |
          git config user.name "robo-dossie"
          git config user.email "actions@users.noreply.github.com"
          git add site/dossie.json site/index.html
          git commit -m "Dossiê: aplica a issue #${NUMERO}"
          git pull --rebase -q
          git push
          gh issue comment "$NUMERO" --body-file resultado.md
          gh issue close "$NUMERO"
          gh workflow run site.yml --ref main

      - name: Recusar (validação falhou)
        if: steps.aplicar.outcome != 'success'
        run: |
          [ -f resultado.md ] || echo "Erro inesperado ao aplicar. Veja o log em Actions." > resultado.md
          gh issue comment "$NUMERO" --body-file resultado.md
          gh issue edit "$NUMERO" --remove-label aprovado
